[project]
name = "boekhouden"
version = "0.1.0"
description = "Local single-user Dutch bookkeeping for an eenmanszaak/VOF"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "jinja2",
    "sqlalchemy>=2",
    "alembic",
    "pydantic-settings",
    "python-multipart",
]

[dependency-groups]
dev = ["pytest", "httpx"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
