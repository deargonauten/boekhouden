[project]
name = "boekhouden"
version = "0.1.0"
description = "Local single-user Dutch bookkeeping for an eenmanszaak/VOF"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "jinja2",
    "sqlalchemy>=2",
    "alembic",
    "pydantic-settings",
    "python-multipart",
    "anthropic>=1.17.0",
    "defusedxml>=0.7.1",
    "reportlab>=5.1.0",
]

[dependency-groups]
dev = [
    "pytest",
    "httpx",
    "pypdf>=6.21.2",
    "pytest-xdist>=3.8.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-m 'not live' -n auto"
markers = ["live: manual smoke test that runs the real claude CLI (pytest -m live)"]
